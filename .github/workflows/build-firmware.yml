name: Build ESP32 Firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check "platformio==6.1.18"

      - name: Create credential-free CI configuration
        run: cp firmware/include/WiFiSecrets.h.example firmware/include/WiFiSecrets.h

      - name: Validate parameter library and project files
        run: python firmware/tests/validate_project.py

      - name: Build application firmware
        run: pio run --project-dir firmware

      - name: Build LittleFS image
        run: pio run --project-dir firmware --target buildfs

      - name: Collect flash files and checksums
        shell: bash
        run: |
          set -euo pipefail
          env_name="waveshare_esp32s3_rs485_can"
          build_dir="firmware/.pio/build/${env_name}"
          output_dir="dist/SAKO-SKI780-ESP32-v0.1.2"
          mkdir -p "${output_dir}"
          cp "${build_dir}/bootloader.bin" "${output_dir}/"
          cp "${build_dir}/partitions.bin" "${output_dir}/"
          cp "${build_dir}/firmware.bin" "${output_dir}/"
          cp "${build_dir}/littlefs.bin" "${output_dir}/"
          cp firmware/partitions.csv "${output_dir}/"
          cp firmware/README_TH.md "${output_dir}/README_TH.md"
          cp firmware/README.md "${output_dir}/README.md"
          (
            cd "${output_dir}"
            sha256sum bootloader.bin partitions.bin firmware.bin littlefs.bin > SHA256SUMS.txt
          )
          cd dist
          zip -r SAKO-SKI780-ESP32-v0.1.2-build.zip SAKO-SKI780-ESP32-v0.1.2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAKO-SKI780-ESP32-v0.1.2-build
          path: dist/SAKO-SKI780-ESP32-v0.1.2-build.zip
          if-no-files-found: error
          retention-days: 30
